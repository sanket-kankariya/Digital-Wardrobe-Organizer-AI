name: wardrobe_app
description: "My personal wardrobe management app"
publish_to: 'none'

version: 1.1.0+3

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Image picking
  image_picker: ^1.1.2

  # File system paths
  path_provider: ^2.1.5

  # Color picker
  flutter_colorpicker: ^1.1.0

  # Charts for profile stats
  fl_chart: ^0.70.2

  # UUID generation for unique IDs
  uuid: ^4.5.1

  # Shared preferences (for theme toggle)
  shared_preferences: ^2.3.5

  # Image processing
  image: ^4.5.4

  # Google Gemini AI (for smart clothing photo tagging)
  google_generative_ai: ^0.4.6

  # Secure storage for user-provided API keys
  flutter_secure_storage: ^9.2.4

  # Google ML Kit: On-device subject & clothing background removal
  google_mlkit_subject_segmentation: ^0.1.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
